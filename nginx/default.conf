server {
    listen 80;
    server_name _;

    # Чуть выше MRTRXFILES_MAX_UPLOAD_SIZE (500 МБ) с запасом на служебные данные формы.
    # Точный лимит всё равно проверяет приложение
    client_max_body_size 530m;

    # Адрес приложения берём через Docker DNS при каждом запросе: после пересборки
    # контейнера у него может смениться IP, и Nginx не должен держать старый
    resolver 127.0.0.11 valid=10s;
    set $backend http://app:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Заголовок ПЕРЕЗАПИСЫВАЕМ, а не дописываем ($proxy_add_x_forwarded_for): иначе клиент
    # мог бы подсунуть чужой адрес и обойти лимиты запросов
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Скачивание: отдаём поток сразу, без буферизации во временные файлы Nginx
    location /f/ {
        proxy_pass $backend;
        proxy_buffering off;
    }

    location / {
        proxy_pass $backend;
    }
}
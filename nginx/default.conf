# Зоны лимитов и кэш: контекст http (этот файл подключается внутри http-блока)
limit_req_zone  $binary_remote_addr zone=api:10m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr zone=upload:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

limit_req_status   429;
limit_conn_status  429;
limit_req_log_level  warn;
limit_conn_log_level warn;

proxy_cache_path /var/cache/nginx/stats levels=1:2 keys_zone=stats:1m
                 max_size=10m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;                       # не показывать версию Nginx

    include /etc/nginx/snippets/security-headers.conf;

    # По умолчанию тело запроса маленькое: JSON-запросы не должны быть больше.
    # Большой лимит только у загрузки (ниже)
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 120s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Адрес приложения через Docker DNS на каждый запрос (IP контейнера может смениться)
    resolver 127.0.0.11 valid=10s;
    set $backend http://app:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Перезаписываем, а не дописываем: клиент не должен подсунуть чужой адрес
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # --- вход и регистрация: общий бюджет на адрес ---
    location = /api/v1/auth/login {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $backend;
    }
    location = /api/v1/auth/register {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $backend;
    }

    # --- загрузка: единственное место с большим телом запроса ---
    location = /api/v1/upload {
        limit_req zone=upload burst=30 nodelay;
        client_max_body_size 530m;           # чуть выше лимита приложения (500 МБ)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass $backend;
    }

    # --- публичная статистика: кэш на минуту ---
    location = /api/v1/stats {
        limit_req zone=api burst=40 nodelay;
        proxy_cache stats;
        # Без query string: иначе ?x=1, ?x=2 ... обходили бы кэш и били в БД
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;                 # при промахе в БД идёт один запрос, остальные ждут
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend;
    }

    # --- остальной API ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $backend;
    }

    # --- скачивание ---
    location /f/ {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 20;                 # не больше 20 одновременных скачиваний с адреса
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # nosniff добавит наш сниппет, чтобы заголовок не продублировался
        proxy_hide_header X-Content-Type-Options;
        # Загруженное содержимое не может ничего исполнять, даже если его откроют как страницу
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend;
    }

    # --- документация, health и всё прочее ---
    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $backend;
    }

    # --- ошибки, которые формирует сам Nginx: в том же JSON-формате, что и API ---
    error_page 413 @too_large;
    error_page 429 @too_many;
    error_page 502 503 504 @unavailable;

    location @too_large {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 413 '{"detail":"Request body is too large"}';
    }
    location @too_many {
        default_type application/json;
        add_header Retry-After 10 always;
        include /etc/nginx/snippets/security-headers.conf;
        return 429 '{"detail":"Too many requests from this address (proxy limit)"}';
    }
    location @unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 503 '{"detail":"Service temporarily unavailable"}';
    }
}